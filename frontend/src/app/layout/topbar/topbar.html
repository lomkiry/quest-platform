<header class="topbar">

  <a class="logo" routerLink="/">
    QUEST
  </a>

  <nav class="navigation">
    <a routerLink="/quests">
      Quests
    </a>

    <a routerLink="/explore">
      Explore
    </a>

    <a routerLink="/leaderboard">
      Leaderboard
    </a>
  </nav>

  <div class="actions">
    <button type="button" (click)="openAuth('login')">
      Login
    </button>

    <button type="button" (click)="openAuth('register')">
      Register
    </button>
  </div>

  @if (isOpen()) {
    <div class="modal-overlay" (click)="closeAuth()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <app-auth-form
          [mode]="authMode()">
        </app-auth-form>
      </div>
    </div>
  }

</header>
